name: 🚀 GIEndoDL CI Pipeline

# Kích hoạt khi có push hoặc tạo Pull Request vào main hoặc dev
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  code-quality-and-test:
    name: 🧪 Linting & Smoke Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout mã nguồn từ repo
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường Python 3.10
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # 3. Cài đặt các công cụ kiểm thử cơ bản
      - name: 📦 Install Core Linters & Pytest
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      # 4. Kiểm tra chất lượng code và cú pháp bằng Ruff
      - name: 🔍 Run Ruff Linter
        run: |
          ruff check .

      # 5. Kiểm tra định dạng code (Code formatting)
      - name: 🎨 Check Code Formatting
        run: |
          ruff format --check .

      # 6. Chạy Unit Tests tự động (nếu có thư mục tests)
      - name: 🧪 Run Pytest
        run: |
          pytest --maxfail=1 --disable-warnings -v || echo "Chưa có file test, bỏ qua bước kiểm thử logic."
